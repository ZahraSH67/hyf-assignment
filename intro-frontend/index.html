<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hogwarts House Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Hogwarts House Generator</h1>

    <input type="text" id="nameInput" placeholder="Enter your name" />

    <div class="buttons">
      <button id="assignBtn">Get House</button>
      <button id="retryBtn" disabled>Try Again</button>
    </div>

    <p id="result"></p>
    <p id="error"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
